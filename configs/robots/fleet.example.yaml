schema_version: 1
robots:
  - id: measurement_robot
    uri: assets/robots/packbot_fukushima.urdf
    format: urdf
    prim_path: /World/Robots/MeasurementRobot
    robot_type: wheeled
    reference:
      model_id: irobot-packbot-fukushima
      manufacturer: iRobot
      model: PackBot, Fukushima Daiichi deployment configuration
      source_urls: [https://www.tepco.co.jp/en/nu/fukushima-np/f1-roadmap/images/11042801a-e.pdf]
      geometry_fidelity: reference_procedural
      dimensions_m: [0.70, 0.53, 0.18]
      mass_kg: 35.0
    fixed_base: false
    package_paths:
      - ros2_ws/install
    translation_m: [0.0, 0.0, 0.0]
    joint_groups:
      - name: sensor_head
        joint_names: [mast_pan_joint, camera_tilt_joint]
        mode: position
    base_controller:
      type: differential
      joint_names: [left_track_joint, right_track_joint]
      wheel_radius_m: 0.08
      track_width_m: 0.41
      maximum_linear_speed_m_s: 2.58
      maximum_angular_speed_rad_s: 2.0
  - id: mitigation_robot
    uri: assets/robots/mhi_meister.xacro
    format: xacro
    prim_path: /World/Robots/MitigationRobot
    robot_type: mobile_manipulator
    reference:
      model_id: mhi-meister
      manufacturer: Mitsubishi Heavy Industries
      model: MEISTeR
      source_urls: [https://www.mhi.com/business/products-services/energy-environment/nuclear-power-generation/robot-mechatronics/meister]
      geometry_fidelity: reference_procedural
      dimensions_m: [1.25, 0.70, 1.30]
      mass_kg: 440.0
    fixed_base: false
    package_paths:
      - ros2_ws/install
    translation_m: [2.0, 0.0, 0.0]
    joint_groups:
      - name: arm
        joint_names:
          - right_arm_joint_1
          - right_arm_joint_2
          - right_arm_joint_3
          - right_arm_joint_4
          - right_arm_joint_5
          - right_arm_joint_6
          - right_arm_joint_7
        mode: position
    grippers:
      - name: tool_gripper
        joint_names: [left_finger_joint, right_finger_joint]
        open_positions: [0.04, 0.04]
        closed_positions: [0.0, 0.0]
    lula_kinematics:
      robot_description_path: configs/robots/mitigation_robot_lula.yaml
      urdf_path: assets/robots/mitigation_robot.urdf
      end_effector_frame: right_tool0
